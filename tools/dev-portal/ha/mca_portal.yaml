# MCA dev-portal mirror on this Pi (docker container `mca-portal`, port 4321).
# Canonical copy lives in the MCA repo at tools/dev-portal/ha/mca_portal.yaml —
# edit there and re-scp to /config/packages/.
#
# Severity mapping: 'degraded' (warn-level checks, e.g. email key absent) does
# NOT page the phone; only unhealthy/down/unavailable does. If the portal
# container itself dies the sensor goes 'unavailable' and the alert fires —
# intentional: monitoring died.
#
# ---------------------------------------------------------------------------
# LINKING TO THE PORTAL  (http://192.168.1.160:4321)
#
# Dashboard card — paste into any dashboard as a Manual card. The link row opens
# the portal in a new tab, which works regardless of how you reached HA:
#
#   type: entities
#   title: MCA App Health
#   entities:
#     - entity: sensor.mca_prod_health
#       name: Production status
#     - entity: binary_sensor.mca_prod_healthy
#       name: Prod OK
#     - type: weblink
#       url: http://192.168.1.160:4321
#       name: Open Dev Portal
#       icon: mdi:monitor-dashboard
#
# Or as a standalone button card:
#
#   type: button
#   name: MCA Dev Portal
#   icon: mdi:monitor-dashboard
#   tap_action:
#     action: url
#     url_path: http://192.168.1.160:4321
#
# SIDEBAR ENTRY: do NOT add `panel_iframe:` here. It was removed from HA core and
# now fails with "Integration 'panel_iframe' not found" — which aborts setup of
# this ENTIRE package, taking the prod health sensor and phone alerts down with
# it (verified the hard way on 2026-07-30).
# For a permanent sidebar entry use the UI instead — it is stored in
# .storage/lovelace_dashboards, not YAML, so this file cannot manage it:
#   Settings > Dashboards > Add Dashboard > Webpage
#   URL: http://192.168.1.160:4321   (tick "Show in sidebar")
#
# Note the URL is plain HTTP. A Webpage dashboard embeds it, so if you open HA
# over HTTPS (Nabu Casa remote, TLS reverse proxy) the browser blocks it as
# mixed content and the panel renders blank. On the LAN over
# http://<ha-host>:8123 it works. The card options above open a new tab instead,
# so they are unaffected either way — prefer them if you use remote access.
# ---------------------------------------------------------------------------
#
sensor:
  - platform: rest
    name: MCA Prod Health
    unique_id: mca_prod_health
    resource: http://192.168.1.160:4321/api/overview
    method: GET
    scan_interval: 60
    timeout: 30
    value_template: >-
      {{ (value_json.environments | selectattr('env','eq','prod') | list | first).status }}
    json_attributes_path: "$.environments[1]"
    json_attributes:
      - env
      - checks
      - version
      - latencyMs
      - checkedAt

template:
  - binary_sensor:
      - name: MCA Prod Healthy
        unique_id: mca_prod_healthy
        device_class: connectivity
        state: >-
          {{ states('sensor.mca_prod_health') in ['healthy', 'degraded'] }}

automation:
  - id: mca_prod_unhealthy
    alias: MCA prod unhealthy
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.mca_prod_healthy
        to: "off"
        for: "00:05:00"
    action:
      - service: notify.mobile_app_sm_s926u
        data:
          title: "MCA prod is DOWN"
          message: >-
            Status: {{ states('sensor.mca_prod_health') }}.
            Portal: http://192.168.1.160:4321

  - id: mca_prod_recovered
    alias: MCA prod recovered
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.mca_prod_healthy
        from: "off"
        to: "on"
        for: "00:02:00"
    condition:
      # Only announce recovery if a down-alert actually went out since the last recovery.
      - condition: template
        value_template: >-
          {{ state_attr('automation.mca_prod_unhealthy','last_triggered') is not none
             and (state_attr('automation.mca_prod_recovered','last_triggered') is none
                  or state_attr('automation.mca_prod_unhealthy','last_triggered')
                     > state_attr('automation.mca_prod_recovered','last_triggered')) }}
    action:
      - service: notify.mobile_app_sm_s926u
        data:
          title: "MCA prod recovered"
          message: "Production health is back to healthy."
