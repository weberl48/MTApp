# Semgrep Security Analysis
# Additional SAST scanning with TypeScript/React-specific rules
# Free tier: https://semgrep.dev/pricing
# https://semgrep.dev/docs/semgrep-ci/overview/

name: Semgrep Security Scan

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    # Run weekly on Saturdays at 3 AM UTC
    - cron: "0 3 * * 6"

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    # Skip dependabot PRs to avoid noise
    if: github.actor != 'dependabot[bot]'

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        run: semgrep ci --sarif-output=semgrep.sarif
        env:
          # Use Semgrep's curated rulesets for JavaScript/TypeScript
          # These cover OWASP Top 10, React security, and more
          SEMGREP_RULES: >-
            p/javascript
            p/typescript
            p/react
            p/nextjs
            p/security-audit
            p/secrets
            p/owasp-top-ten

      # Optional: Upload results to GitHub Security tab
      # Requires SARIF support (available in Semgrep free tier)
      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true
